<!DOCTYPE html>
<html>
<head>
  <title>Lab 6 - Pseudo-Classes</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; padding: 15px; }

    a:link    { color: blue; }
    a:visited { color: purple; }
    a:hover   { color: red; }
    a:active  { color: orange; }

    .anchor-box { border: 2px solid #333; padding: 10px; display: inline-block; margin-bottom: 20px; }

    /* Tooltip */
    .tip { position: relative; display: inline-block; margin: 3px; }
    .tip .txt {
      visibility: hidden;
      background: #555; color: white;
      padding: 4px 8px; font-size: 11px;
      white-space: nowrap; position: absolute; z-index: 1;
    }
    .tip:hover .txt { visibility: visible; }
    .tip.top    .txt { bottom: 110%; left: 50%; transform: translateX(-50%); }
    .tip.bottom .txt { top: 110%;    left: 50%; transform: translateX(-50%); }
    .tip.left   .txt { right: 110%;  top: 50%;  transform: translateY(-50%); }
    .tip.right  .txt { left: 110%;   top: 50%;  transform: translateY(-50%); }

    button { padding: 5px 10px; cursor: pointer; margin: 2px; font-size: 12px; }
    .primary button { background: #3498db; color: white; border: none; }
    .success button { background: #2ecc71; color: white; border: none; }
    .warning button { background: #f39c12; color: white; border: none; }
    .danger  button { background: #e74c3c; color: white; border: none; }
    .success .txt { background: #2ecc71; }

    .tbox { border: 1px solid #ccc; padding: 12px; max-width: 480px; }
    h4 { text-align: center; margin-bottom: 10px; }
    .row { margin: 5px 0; }
  </style>
</head>
<body>

  <div class="anchor-box">
    <strong>Anchor Pseudo-Classes</strong><br><br>
    <a href="https://claude.ai">Visit Claude.ai</a><br>
    <a href="https://maps.google.com">Visit Google Maps</a><br>
    <a href="https://google.com">Visit Google.com</a>
  </div>

  <div class="tbox">
    <h4>CSS Tooltip</h4>
    <p class="row">Hover the buttons below to see different tooltip variations:</p>
    <div class="row">
      <span class="tip top"><button>Default Tooltip</button><span class="txt">Top tooltip</span></span>
      <span class="tip bottom"><button>Bottom Tooltip</button><span class="txt">Bottom tooltip</span></span>
      <span class="tip left"><button>Left Tooltip</button><span class="txt">Left tooltip</span></span>
      <span class="tip right"><button>Right Tooltip</button><span class="txt">Right tooltip</span></span>
    </div>
    <div class="row">
      <span class="tip primary top"><button>Primary Tooltip</button><span class="txt">Primary</span></span>
      <span class="tip success top"><button>Success Tooltip</button><span class="txt">Success color tooltip</span></span>
      <span class="tip warning top"><button>Warning Tooltip</button><span class="txt">Warning</span></span>
      <span class="tip danger  top"><button>Danger Tooltip</button><span class="txt">Danger</span></span>
    </div>
  </div>

</body>
</html>

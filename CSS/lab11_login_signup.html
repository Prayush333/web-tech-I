<!DOCTYPE html>
<html>
<head>
  <title>Lab 11 - Login & Signup</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; gap: 20px; padding: 30px; }

    .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); width: 270px; }
    .brand { color: #1877f2; font-size: 26px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    h3 { text-align: center; font-weight: normal; font-size: 16px; margin-bottom: 10px; }

    input[type="text"], input[type="email"], input[type="password"], select {
      width: 100%; padding: 8px; margin-bottom: 8px;
      border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
    }
    .row2 { display: flex; gap: 6px; }
    .row2 input { flex: 1; }

    .btn-blue  { width: 100%; padding: 10px; background: #1877f2; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-green { display: block; margin: 0 auto; padding: 8px 16px; background: #42b72a; color: white; border: none; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }

    .center { text-align: center; font-size: 12px; margin: 6px 0; }
    .center a { color: #1877f2; text-decoration: none; }
    hr { border: none; border-top: 1px solid #ddd; margin: 8px 0; }

    .lbl { font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px; }
    .bday { display: flex; gap: 4px; }
    .bday select { flex: 1; }
    .genders { display: flex; gap: 5px; }
    .gbox { border: 1px solid #ccc; border-radius: 4px; padding: 5px 8px; flex: 1; font-size: 12px; display: flex; justify-content: space-between; }
    .gbox input { width: auto; margin: 0; padding: 0; }
    .terms { font-size: 10px; color: #777; margin: 6px 0; line-height: 1.4; }
    .terms a { color: #1877f2; }

    .signup { width: 300px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">facebook</div>
    <h3>Log in to Facebook</h3>
    <input type="text" placeholder="Email address or phone number">
    <input type="password" placeholder="Password">
    <button class="btn-blue">Log in</button>
    <div class="center"><a href="#">Forgotten account?</a></div>
    <hr>
    <div class="center"><button class="btn-green">Create new account</button></div>
  </div>

  <div class="card signup">
    <div class="brand">facebook</div>
    <h3>Create a new account</h3>
    <p class="center" style="color:#606770;font-size:11px;margin-bottom:8px;">It's quick and easy.</p>
    <div class="row2">
      <input type="text" placeholder="First name">
      <input type="text" placeholder="Last name">
    </div>
    <input type="text" placeholder="Mobile number or email">
    <input type="password" placeholder="New password">
    <label class="lbl">Birthday ⓘ</label>
    <div class="bday">
      <select><option>Aug</option><option>Jan</option><option>Feb</option></select>
      <select><option>19</option><option>1</option><option>2</option></select>
      <select><option>2024</option><option>2023</option><option>2000</option></select>
    </div>
    <label class="lbl" style="margin-top:8px;">Gender ⓘ</label>
    <div class="genders">
      <label class="gbox">Female <input type="radio" name="g"></label>
      <label class="gbox">Male   <input type="radio" name="g"></label>
      <label class="gbox">Custom <input type="radio" name="g"></label>
    </div>
    <p class="terms">By clicking Sign Up, you agree to our <a href="#">Terms</a>, <a href="#">Privacy Policy</a> and <a href="#">Cookies Policy</a>.</p>
    <div class="center"><button class="btn-green" style="padding:8px 50px;">Sign Up</button></div>
    <div class="center" style="margin-top:8px;"><a href="#">Already have an account?</a></div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Lab 16 - Responsive (Tablet ~768px)</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial;font-size:13px}
    .header,.navigation,.sidebar,.main,.ads,.footer{border:1px solid red;padding:10px}
    .grid{display:grid;grid-template-areas:"header header" "nav nav" "sidebar main" "ads footer";grid-template-columns:130px 1fr}
    .header{grid-area:header}
    .navigation{grid-area:nav}
    .sidebar{grid-area:sidebar;min-height:140px}
    .main{grid-area:main}
    .ads{grid-area:ads}
    .footer{grid-area:footer}
    .navigation,.sidebar,.main,.ads,.footer{border-top:none}
    .main,.footer{border-left:none}
  </style>
</head>
<body>
  <div class="grid">
    <div class="header">Header</div>
    <div class="navigation">Navigation</div>
    <div class="sidebar">Sidebar</div>
    <div class="main">Main</div>
    <div class="ads">ads</div>
    <div class="footer">Footer</div>
  </div>
</body>
</html>

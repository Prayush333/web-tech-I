<!DOCTYPE html>
<html>
<head>
    <title>Lab 1</title>
</head>
<body>
<script>
    let inputStr = prompt("Enter a string: ");

    let reversedStr = "";

    for (let i = inputStr.length - 1; i >= 0; i--) {
        reversedStr += inputStr[i];
    }

    document.write("Original String : " + inputStr + "<br>");
    document.write("Reversed String : " + reversedStr + "<br>");
</script>
</body>
</html>

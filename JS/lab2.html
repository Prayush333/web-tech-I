<!DOCTYPE html>
<html>
<head>
    <title>Lab 2</title>
</head>
<body>
<script>
    let num = parseInt(prompt("Enter a number: "));

    let original = num;
    let reversedNum = 0;
    let digits = [];

    while (num > 0) {
        let digit = num % 10;
        reversedNum = reversedNum * 10 + digit;
        digits.push(digit);
        num = Math.floor(num / 10);
    }

    document.write("Original Number  : " + original + "<br>");
    document.write("Reversed Number  : " + reversedNum + "<br>");

    if (original === reversedNum) {
        document.write(original + " is a Palindrome" + "<br>");
    } else {
        document.write(original + " is NOT a Palindrome" + "<br>");
    }

    let sum = 0;
    let numDigits = digits.length;
    for (let d of digits) {
        sum += Math.pow(d, numDigits);
    }

    if (sum === original) {
        document.write(original + " is an Armstrong number" + "<br>");
    } else {
        document.write(original + " is NOT an Armstrong number" + "<br>");
    }
</script>
</body>
</html>

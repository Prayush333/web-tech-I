<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 8 - Real-Time Clock</title>
</head>
<body>

  <h2>Real-Time Clock</h2>
  <p id="clock"></p>

  <script>
    function updateClock() {
      let now = new Date();
      let h = now.getHours();
      let m = now.getMinutes();
      let s = now.getSeconds();
      h = h < 10 ? "0" + h : h;
      m = m < 10 ? "0" + m : m;
      s = s < 10 ? "0" + s : s;
      document.getElementById("clock").innerText = h + ":" + m + ":" + s;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 17 - AJAX Read File</title>
</head>
<body>

  <h2>Read a File Asynchronously using AJAX</h2>
  <button onclick="readFile()">Read File</button>
  <p id="output"></p>

  <script>
    function readFile() {
      let xhr = new XMLHttpRequest();
      xhr.open("GET", "sample.txt", true);

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            document.getElementById("output").innerText = xhr.responseText;
          } else {
            document.getElementById("output").innerText =
              "Error: Unable to load file. Status code: " + xhr.status;
          }
        }
      };

      xhr.send();
    }
  </script>

</body>
</html>

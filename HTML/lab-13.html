<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

<h3>Ordered List</h3>
<ol>
    <li>Coffee</li>
    <li>Tea</li>
    <li>Milk</li>
</ol>
<ol type="I">
    <li>Coffee</li>
    <li>Tea</li>
    <li>Milk</li>
</ol>

<h3>Unordered List</h3>
<ul>
    <li>Apple</li>
    <li>Bananas</li>
    <li>Lemons</li>
    <li>Oranges</li>
</ul>

<h3>Definition List</h3>
<dl>
    <dt>Coffee</dt>
    <dd>-A black hot drink</dd>
    <dt>Milk</dt>
    <dd>-A white cold drink</dd>
</dl>

</body>
</html>

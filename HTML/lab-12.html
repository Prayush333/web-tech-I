<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

<h3>Ordered List</h3>
<ol>
    <li>HTML</li>
    <li>CSS</li>
</ol>

<h3>Unordered List</h3>
<ul>
    <li>Java</li>
    <li>Python</li>
</ul>

<h3>Definition List</h3>
<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>
</dl>

</body>
</html>

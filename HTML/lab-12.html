<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Form</title>
</head>
    <body>
        
        <form action="/submit" method="post">
            <fieldset>
                <legend>Student Information</legend>
                <br>
                <!-- Text input with autofocus and autocomplete -->
                Full Name:
                <input type="text" autofocus required>
                <br><br>

                <!-- Email input -->
                Email:
                <input type="email" autocomplete="email" required>
                <br><br>

                <!-- Password input -->
                Password:
                <input type="password" required>
                <br><br>

                <!-- Number input -->
                Age:
                <input type="number"  min="1" max="120" required>
                <br><br>

                <!-- Date input -->
                Date of Birth:
                <input type="date" required>
                <br>

                <!-- Radio buttons -->
                <p>Gender:</p>
                <input type="radio" id="male" name="gender" required>male
                <input type="radio" id="female" name="gender" required>female
                <input type="radio" id="other" name="gender" required>other
                
                <br><br>

                <!-- Checkbox -->
                <input type="checkbox"  required>
                <label for="terms">I agree to the terms and conditions</label>
                <br><br>

                <!-- Select dropdown -->
                Country:
                <select  required>
                    <option >Nepal</option>
                    <option >USA</option>
                    <option >Germany</option>
                    <option >UK</option>
                </select>
                <br><br>

                <!-- Textarea -->
                Short Bio: <br>
                <textarea rows="4" cols="30"></textarea>
                <br><br>

                <!-- Disabled input -->
                <label for="ref">Referral Code:</label>
                <input type="text"  value="ABC123" disabled>
                <br><br>

                <!-- Submit button -->
                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </body>
</html>

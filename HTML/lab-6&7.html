<!DOCTYPE html>
<html>
<head>
    <title>Image Map</title>
</head>
<body>

<img src="img/device.webp" usemap="#devices" width="600" height="200" alt="Devices Image">

<map name="devices">
    <area shape="rect" coords="300,0,200,200" href="img/coffee.webp" alt="Computer">
    <area shape="rect" coords="0,0,400,200" href="img/laptop.webp" alt="Phone">
    <area shape="rect" coords="250,0,180,180" href="img/phone.webp" alt="Coffee">
</map>

</body>
</html>
